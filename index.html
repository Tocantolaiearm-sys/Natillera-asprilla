<style>
:root {
  --negro: #0A0A0A; --negro2: #141414; --negro3: #1E1E1E;
  --miel: #D4963A; --miel-claro: #E8B86D; --miel-pale: #FDF3DC;
  --miel-dark: #A8721E; --crema: #F5E6C8;
  --gris: #6B6B6B; --blanco: #FFFFFF;
  --verde: #00C48C; --rojo: #FF4D6D;
  --shadow-dark: 0 8px 40px rgba(0,0,0,0.5);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--negro); color:var(--blanco); min-height:100vh; }

/* SYNC INDICATOR */
.sync-bar {
  position:fixed; bottom:0; left:0; right:0;
  background:var(--negro2); border-top:1px solid rgba(212,150,58,0.15);
  padding:6px 20px; display:flex; align-items:center; justify-content:space-between;
  font-size:11px; color:var(--gris); z-index:300;
}
.sync-dot {
  width:7px; height:7px; border-radius:50%; background:var(--gris);
  display:inline-block; margin-right:6px; transition:background .3s;
}
.sync-dot.syncing { background:var(--miel); animation:pulse 1s infinite; }
.sync-dot.ok { background:var(--verde); }
.sync-dot.error { background:var(--rojo); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* LOGIN */
#login-screen {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background: radial-gradient(ellipse at 30% 20%, rgba(212,150,58,0.13) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 80%, rgba(212,150,58,0.07) 0%, transparent 50%), var(--negro);
  padding:20px;
}
.login-card {
  background:var(--negro2); border:1px solid rgba(212,150,58,0.22); border-radius:28px;
  padding:44px 40px; width:100%; max-width:420px;
  box-shadow:var(--shadow-dark), 0 0 60px rgba(212,150,58,0.07); animation:fadeUp .5s ease;
  position:relative; overflow:hidden;
}

.login-logo { text-align:center; margin-bottom:32px; position:relative; }
.login-logo img {
  width:110px; height:110px; object-fit:contain; border-radius:50%;
  border:2px solid rgba(212,150,58,0.35); margin-bottom:14px; background:#fff;
}
.login-logo h1 {
  font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700;
  background:linear-gradient(135deg,var(--crema),var(--miel));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.login-logo p { color:var(--gris); font-size:13px; margin-top:3px; }

.login-tabs {
  display:flex; background:var(--negro3); border-radius:12px;
  padding:4px; margin-bottom:26px; border:1px solid rgba(255,255,255,0.06);
}
.login-tab {
  flex:1; padding:10px; border:none; background:transparent; border-radius:9px;
  font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500;
  cursor:pointer; color:var(--gris); transition:all .2s;
}
.login-tab.active {
  background:linear-gradient(135deg,var(--miel-dark),var(--miel));
  color:var(--negro); font-weight:600; box-shadow:0 2px 12px rgba(212,150,58,0.35);
}
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:11px; font-weight:600; color:var(--gris); margin-bottom:7px; letter-spacing:.6px; text-transform:uppercase; }
.form-group input, .form-group select {
  width:100%; padding:13px 16px; background:var(--negro3);
  border:1px solid rgba(255,255,255,0.07); border-radius:11px;
  font-family:'DM Sans',sans-serif; font-size:15px; color:var(--blanco);
  outline:none; transition:border .2s; appearance:none;
}
.form-group input:focus, .form-group select:focus {
  border-color:rgba(212,150,58,0.55); box-shadow:0 0 0 3px rgba(212,150,58,0.09);
}
.btn-primary {
  width:100%; padding:14px;
  background:linear-gradient(135deg,var(--miel-dark),var(--miel),var(--miel-claro));
  border:none; border-radius:12px; font-family:'DM Sans',sans-serif;
  font-size:15px; font-weight:700; color:var(--negro); cursor:pointer;
  box-shadow:0 4px 20px rgba(212,150,58,0.38); transition:transform .15s, box-shadow .15s;
}
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 28px rgba(212,150,58,0.5); }
.login-error { color:var(--rojo); font-size:13px; text-align:center; margin-top:12px; display:none; }
.hint { color:var(--gris); font-size:12px; text-align:center; margin-top:12px; }

/* TOPBAR */
.topbar {
  background:var(--negro2); border-bottom:1px solid rgba(212,150,58,0.14);
  padding:0 28px; height:62px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100; box-shadow:0 2px 20px rgba(0,0,0,0.35);
}
.topbar-brand { display:flex; align-items:center; gap:12px; }
.topbar-logo { width:38px; height:38px; object-fit:contain; border-radius:50%; background:#fff; border:1.5px solid rgba(212,150,58,0.3); }
.topbar-brand h1 {
  font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:700;
  background:linear-gradient(135deg,var(--crema),var(--miel));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.topbar-right { display:flex; align-items:center; gap:12px; }
.user-pill { background:rgba(212,150,58,0.1); border:1px solid rgba(212,150,58,0.2); border-radius:20px; padding:5px 14px; font-size:13px; color:var(--miel-claro); }
.badge-admin { background:linear-gradient(135deg,var(--miel-dark),var(--miel)); color:var(--negro); border-radius:6px; padding:3px 9px; font-size:11px; font-weight:700; letter-spacing:.5px; }
.btn-logout { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.09); color:var(--gris); border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all .2s; }
.btn-logout:hover { color:var(--blanco); border-color:rgba(255,255,255,0.2); }

/* MAIN */
.main { padding:28px; max-width:1180px; margin:0 auto; padding-bottom:50px; }

/* STATS */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:28px; }
.stat-card {
  background:var(--negro2); border:1px solid rgba(255,255,255,0.05);
  border-radius:18px; padding:22px; position:relative; overflow:hidden;
  animation:fadeUp .4s ease both; transition:border .2s, transform .2s;
}
.stat-card:hover { border-color:rgba(212,150,58,0.28); transform:translateY(-2px); }
.stat-card::before { content:''; position:absolute; top:-30px; right:-30px; width:90px; height:90px; border-radius:50%; opacity:.07; }
.stat-card.miel::before { background:var(--miel); }
.stat-card.verde::before { background:var(--verde); }
.stat-card.blanco::before { background:#fff; }
.stat-card.rojo::before { background:var(--rojo); }
.stat-icon { font-size:20px; width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
.stat-card.miel .stat-icon { background:rgba(212,150,58,0.12); }
.stat-card.verde .stat-icon { background:rgba(0,196,140,0.12); }
.stat-card.blanco .stat-icon { background:rgba(255,255,255,0.06); }
.stat-card.rojo .stat-icon { background:rgba(255,77,109,0.12); }
.stat-value { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:700; color:var(--blanco); margin-bottom:3px; }
.stat-card.rojo .stat-value { color:var(--rojo); }
.stat-label { font-size:12px; color:var(--gris); }

/* TABS */
.section-tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
.section-tab {
  padding:9px 20px; border-radius:10px; font-size:13px; font-weight:600;
  cursor:pointer; border:1px solid rgba(255,255,255,0.09); color:var(--gris);
  background:none; font-family:'DM Sans',sans-serif; transition:all .2s;
}
.section-tab.active { background:linear-gradient(135deg,var(--miel-dark),var(--miel)); color:var(--negro); border-color:transparent; box-shadow:0 2px 12px rgba(212,150,58,0.3); }

/* SECTION HEADER */
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px; }
.section-title { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; }
.search-box {
  display:flex; align-items:center; gap:8px; background:var(--negro2);
  border:1px solid rgba(255,255,255,0.07); border-radius:10px; padding:9px 14px; transition:border .2s;
}
.search-box:focus-within { border-color:rgba(212,150,58,0.4); }
.search-box input { border:none; outline:none; background:transparent; font-family:'DM Sans',sans-serif; font-size:14px; color:var(--blanco); width:180px; }
.search-box input::placeholder { color:var(--gris); }
.filter-tabs { display:flex; gap:8px; flex-wrap:wrap; }
.filter-tab {
  padding:6px 14px; border-radius:99px; font-size:12px; font-weight:500;
  cursor:pointer; border:1px solid rgba(255,255,255,0.09); color:var(--gris);
  background:none; font-family:'DM Sans',sans-serif; transition:all .15s;
}
.filter-tab.active { background:rgba(212,150,58,0.15); border-color:var(--miel); color:var(--miel-claro); }

/* TABLE */
.table-wrap { background:var(--negro2); border:1px solid rgba(255,255,255,0.05); border-radius:20px; overflow:hidden; animation:fadeUp .5s ease .1s both; }
table { width:100%; border-collapse:collapse; }
thead { background:rgba(212,150,58,0.06); border-bottom:1px solid rgba(212,150,58,0.12); }
thead th { padding:13px 16px; text-align:left; font-size:11px; font-weight:600; color:rgba(212,150,58,0.7); letter-spacing:.8px; text-transform:uppercase; }
tbody tr { border-bottom:1px solid rgba(255,255,255,0.04); transition:background .15s; cursor:pointer; }
tbody tr:last-child { border-bottom:none; }
tbody tr:hover { background:rgba(212,150,58,0.05); }
tbody td { padding:12px 16px; font-size:14px; }
.socio-name { font-weight:600; color:var(--blanco); }
.socio-sub { font-size:11px; color:var(--gris); margin-top:2px; }
.tag { display:inline-block; border-radius:6px; padding:3px 9px; font-size:11px; font-weight:600; }
.tag.quincenal { background:rgba(212,150,58,0.12); color:var(--miel-claro); }
.tag.mensual { background:rgba(0,196,140,0.10); color:var(--verde); }
.amount-verde { font-weight:600; color:var(--verde); }
.amount-miel { font-weight:600; color:var(--miel-claro); }
.amount-rojo { font-weight:600; color:var(--rojo); }
.btn-edit { background:none; border:1px solid rgba(255,255,255,0.09); border-radius:8px; padding:5px 12px; font-size:12px; font-weight:500; color:var(--gris); cursor:pointer; font-family:'DM Sans',sans-serif; transition:all .15s; }
.btn-edit:hover { border-color:var(--miel); color:var(--miel-claro); }

/* MODAL */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.78); backdrop-filter:blur(6px); z-index:200; display:flex; align-items:center; justify-content:center; animation:fadeIn .2s ease; padding:20px; }
.modal { background:var(--negro2); border:1px solid rgba(212,150,58,0.2); border-radius:24px; padding:32px; width:100%; max-width:580px; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-dark); animation:fadeUp .3s ease; }
.modal h2 { font-family:'Cormorant Garamond',serif; font-size:22px; margin-bottom:4px; }
.modal-sub { font-size:13px; color:var(--gris); margin-bottom:22px; }
.detail-section { margin-bottom:20px; }
.detail-section h3 { font-size:11px; color:rgba(212,150,58,0.6); text-transform:uppercase; letter-spacing:.8px; margin-bottom:10px; border-bottom:1px solid rgba(212,150,58,0.1); padding-bottom:6px; }
.detail-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:14px; }
.detail-row:last-child { border-bottom:none; }
.detail-row .lbl { color:var(--gris); }
.detail-row .val { font-weight:600; }
.val.verde { color:var(--verde); }
.val.miel { color:var(--miel-claro); }
.val.rojo { color:var(--rojo); }

.pagos-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:8px; }
.pagos-table { width:100%; min-width:380px; border-collapse:collapse; font-size:13px; }
.pagos-table th { padding:8px 10px; text-align:left; color:rgba(212,150,58,0.6); font-size:10px; text-transform:uppercase; letter-spacing:.7px; background:rgba(212,150,58,0.05); border-bottom:1px solid rgba(212,150,58,0.1); white-space:nowrap; }
.pagos-table td { padding:9px 10px; border-bottom:1px solid rgba(255,255,255,0.04); white-space:nowrap; }
.pagos-table tr:last-child td { border-bottom:none; }
.tipo-ahorro { color:var(--verde); font-weight:600; }
.tipo-actividad { color:var(--miel-claro); font-weight:600; }
.valor-cell { font-weight:700; text-align:right; }
.valor-ahorro { color:var(--verde); }
.valor-actividad { color:var(--miel-claro); }

.modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.modal-footer { display:flex; gap:10px; margin-top:22px; }
.btn-save { flex:1; padding:12px; background:linear-gradient(135deg,var(--miel-dark),var(--miel),var(--miel-claro)); border:none; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; color:var(--negro); cursor:pointer; box-shadow:0 4px 14px rgba(212,150,58,0.35); transition:transform .15s; }
.btn-save:hover { transform:translateY(-1px); }
.btn-cancel { padding:12px 18px; background:none; border:1px solid rgba(255,255,255,0.09); border-radius:10px; font-family:'DM Sans',sans-serif; font-size:14px; color:var(--gris); cursor:pointer; transition:all .15s; }
.btn-cancel:hover { color:var(--blanco); }

/* SOCIO VIEW */
#socio-view { position:relative; }

.hero-card {
  background:linear-gradient(135deg,#12100A 0%,#221A08 50%,#130E02 100%);
  border:1px solid rgba(212,150,58,0.28); border-radius:24px; padding:32px;
  margin-bottom:22px; position:relative; overflow:hidden; animation:fadeUp .4s ease;
  box-shadow:0 8px 40px rgba(0,0,0,0.5),0 0 60px rgba(212,150,58,0.06);
}
.hero-card::before { content:'🐷'; position:absolute; right:20px; bottom:-12px; font-size:95px; opacity:.1; transform:rotate(-8deg); }
.hero-card::after { content:''; position:absolute; top:-50px; right:-50px; width:160px; height:160px; border-radius:50%; background:radial-gradient(circle,rgba(212,150,58,0.18),transparent); }
.hero-greeting { font-size:13px; color:var(--miel-claro); opacity:.8; margin-bottom:4px; }
.hero-name { font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; margin-bottom:6px; }
.hero-libreta { font-size:13px; color:var(--gris); margin-bottom:20px; }
.hero-amount-label { font-size:11px; color:rgba(212,150,58,0.6); text-transform:uppercase; letter-spacing:.8px; margin-bottom:4px; }
.hero-amount { font-family:'Cormorant Garamond',serif; font-size:48px; font-weight:700; color:var(--miel-claro); line-height:1; margin-bottom:4px; position:relative; z-index:1; }
.hero-sub { font-size:12px; color:rgba(255,255,255,0.4); }

.socio-cards { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:20px; }
.info-card { background:var(--negro2); border:1px solid rgba(255,255,255,0.05); border-radius:18px; padding:22px; animation:fadeUp .5s ease .1s both; transition:border .2s; }
.info-card:hover { border-color:rgba(212,150,58,0.18); }
.info-card h3 { font-family:'Cormorant Garamond',serif; font-size:17px; margin-bottom:14px; }

/* PRESTAMOS TABLE */
.prestamos-table { width:100%; border-collapse:collapse; font-size:14px; }
.prestamos-table th { padding:12px 16px; text-align:left; font-size:11px; font-weight:600; color:rgba(212,150,58,0.7); letter-spacing:.8px; text-transform:uppercase; background:rgba(212,150,58,0.06); border-bottom:1px solid rgba(212,150,58,0.12); }
.prestamos-table td { padding:12px 16px; border-bottom:1px solid rgba(255,255,255,0.04); }
.prestamos-table tr:last-child td { border-bottom:none; }
.prestamos-table tr:hover td { background:rgba(255,77,109,0.04); }
.prestamo-nombre { font-weight:600; color:var(--blanco); }
.prestamo-cc { font-size:11px; color:var(--gris); }

@keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@media(max-width:680px){
  .main { padding:14px; padding-bottom:50px; }
  .topbar { padding:0 14px; }
  .socio-cards { grid-template-columns:1fr; }
  .modal-grid { grid-template-columns:1fr; }
  .modal { padding:22px 16px; }
  .hero-amount { font-size:36px; }
}
.empty-msg { text-align:center; padding:50px 20px; color:var(--gris); }
</style>
</head>

async function syncFromSheets() {
  const dot = document.getElementById('sync-dot');
  const msg = document.getElementById('sync-msg');
  const timeEl = document.getElementById('sync-time');
  dot.className='sync-dot syncing'; msg.textContent='Sincronizando datos...';
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());

    const parsed = parseCSV(text);
    if(parsed.length > 0) {
      SOCIOS = parsed;
      lastSync = new Date();
      dot.className='sync-dot ok'; msg.textContent='Datos actualizados';
      timeEl.textContent='Última sync: ' + lastSync.toLocaleTimeString('es-CO');

      }
    }
  } catch(e) {
    dot.className='sync-dot error'; msg.textContent='Sin conexión — usando datos locales';
    console.warn('Sync error:', e);
  }

      .replace(/\./g,'')
      .replace(/,/g,'.')
  ) || 0;
}


function parseCSV(text) {

  function splitCSVLine(line) {
    const result = [];
    let current = '';
    let insideQuotes = false;

    for (let i = 0; i < line.length; i++) {
      const char = line[i];

      if (char === '"') {
        insideQuotes = !insideQuotes;
        continue;
      }

      if (char === ',' && !insideQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }

    result.push(current.trim());
    return result;
  }

  const lines = text.trim().split('\\n').map(splitCSVLine);

  if(lines.length < 3) return [];

  let headerIdx = -1;

  for(let i = 0; i < Math.min(5, lines.length); i++) {
    if(lines[i].some(c =>
      c.includes('CATEGORIA') ||
      c.includes('SOCIO') ||
      c.includes('CC')
    )) {
      headerIdx = i;
      break;
    }
  }

  if(headerIdx < 0) return [];

  const headers = lines[headerIdx].map(h => h.trim());

  const getCol = name =>
    headers.findIndex(h =>
      h.toUpperCase().includes(name.toUpperCase())
    );

  const iCat = getCol('CATEGORIA');
  const iNom = getCol('SOCIO');
  const iCC = getCol('CC');
  const iLib = getCol('LIB');
  const iTel = getCol('TELEFONO');
  const iAhorro = getCol('AHORRO');
  const iCuotas = getCol('CUOTAS');
  const iTotal = getCol('TOTAL');
  const iPrest = getCol('PRESTAMO');

  const socios = {};

  for(let r = headerIdx + 1; r < lines.length; r++) {

    const row = lines[r];

    if(!row[iCC] || row[iCC] === 'CC') continue;

    const cc = (row[iCC] || '').replace(/[^0-9]/g,'');

    if(!cc) continue;

    const nombre = (row[iNom] || '').trim();
    const categoria = (row[iCat] || '').trim();
    const modalidad = (row[iAhorro] || '').trim();
    const libreta = (row[iLib] || '').trim();
    const telefono = (row[iTel] || '').replace(/[^0-9]/g,'');

    const total = limpiarNumeroColombiano(row[iTotal]);
    const prestamoRaw = limpiarNumeroColombiano(row[iPrest]);

    const prestamo = prestamoRaw < 0
      ? Math.abs(prestamoRaw)
      : 0;

    if(!socios[cc]) {
      socios[cc] = {
        cc,
        nombre,
        modalidad,
        libreta,
        telefono,
        ahorros: 0,
        actividades: 0,
        prestamo: 0,
        pagos: []
      };
    }

    const s = socios[cc];

    if(prestamo > s.prestamo)
      s.prestamo = prestamo;

    if(categoria.includes('Ahorro'))
      s.ahorros += total;
    else
      s.actividades += total;
  }

  return Object.values(socios);
}


// ── LOGIN ──
function setTab(t){
  document.querySelectorAll('.login-tab').forEach((b,i)=>b.classList.toggle('active',(i===0&&t==='socio')||(i===1&&t==='admin')));
  document.getElementById('tab-socio').style.display=t==='socio'?'':'none';
  document.getElementById('tab-admin').style.display=t==='admin'?'':'none';
  document.getElementById('login-err').style.display='none';
}

function loginAdmin(){
  if(document.getElementById('admin-pass').value===ADMIN_PASS) startSession({tipo:'admin'});
  else document.getElementById('login-err').style.display='block';
}

function loginSocio(){
  const cc=document.getElementById('socio-cc').value.trim();
  const pass=document.getElementById('socio-pass').value.trim();
  const s=SOCIOS.find(x=>x.cc===cc);
  if(s&&pass===cc) startSession({tipo:'socio',socio:s});
  else document.getElementById('login-err').style.display='block';
}

function startSession(user){
  currentUser=user;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  const pill=document.getElementById('topbar-user');
  if(user.tipo==='admin'){
    pill.textContent='Administrador';
    document.getElementById('badge-admin').style.display='inline-block';
    document.getElementById('admin-view').style.display='block';
    document.getElementById('socio-view').style.display='none';
    renderStats(); renderTable(); renderPrestamos();
  } else {
    pill.textContent=user.socio.nombre.split(' ')[0];
    document.getElementById('badge-admin').style.display='none';
    document.getElementById('admin-view').style.display='none';
    document.getElementById('socio-view').style.display='block';
    renderSocioView(user.socio);
  }
  startSync();
}

function logout(){
  currentUser=null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('sync-bar').style.display='none';
  document.getElementById('login-err').style.display='none';
  ['admin-pass','socio-cc','socio-pass'].forEach(id=>document.getElementById(id).value='');
}

function setSection(sec,btn){

  btn.classList.add('active');

// ── ADMIN STATS ──
function renderStats(){
  const totalAhorro=SOCIOS.reduce((a,s)=>a+s.ahorros,0);
  const totalAct=SOCIOS.reduce((a,s)=>a+s.actividades,0);
  const totalPrestamo=SOCIOS.reduce((a,s)=>a+s.prestamo,0);
  const numPrestamos=SOCIOS.filter(s=>s.prestamo>0).length;
  const quinc=SOCIOS.filter(s=>s.modalidad.includes('Quincenal')).length;
  const mens=SOCIOS.filter(s=>s.modalidad.includes('Mensual')).length;
  document.getElementById('stats-grid').innerHTML=`
    <div class="stat-card miel" style="animation-delay:.00s"><div class="stat-icon">💰</div><div class="stat-value">${fmt(totalAhorro)}</div><div class="stat-label">Total en ahorros</div></div>
    <div class="stat-card miel" style="animation-delay:.07s"><div class="stat-icon">🎯</div><div class="stat-value">${fmt(totalAct)}</div><div class="stat-label">Total en actividades</div></div>
    <div class="stat-card rojo" style="animation-delay:.14s"><div class="stat-icon">💳</div><div class="stat-value">${fmt(totalPrestamo)}</div><div class="stat-label">Total préstamos · ${numPrestamos} socios</div></div>
    <div class="stat-card blanco" style="animation-delay:.21s"><div class="stat-icon">👥</div><div class="stat-value">${SOCIOS.length}</div><div class="stat-label">Socias/os activos</div></div>
    <div class="stat-card verde" style="animation-delay:.28s"><div class="stat-icon">📅</div><div class="stat-value">${quinc}Q / ${mens}M</div><div class="stat-label">Quincenal / Mensual</div></div>
  `;
}

// ── PRESTAMOS TABLE ──
function renderPrestamos(){
  const conPrestamo=SOCIOS.filter(s=>s.prestamo>0).sort((a,b)=>b.prestamo-a.prestamo);
  const total=conPrestamo.reduce((a,s)=>a+s.prestamo,0);
  document.getElementById('prestamo-resumen').textContent=`${conPrestamo.length} socios · Total: ${fmt(total)}`;
  const tbody=document.getElementById('prestamos-tbody');
  if(!conPrestamo.length){
    tbody.innerHTML='<tr><td colspan="4"><div class="empty-msg">No hay préstamos registrados</div></td></tr>';
    return;
  }
  tbody.innerHTML=conPrestamo.map(s=>`
    <tr onclick="openViewModal('${s.cc}')" style="cursor:pointer">
      <td><div class="prestamo-nombre">${s.nombre}</div><div class="prestamo-cc">CC: ${s.cc} · Tel: ${s.telefono}</div></td>
      <td style="color:var(--gris);font-size:13px">📓 ${s.libreta}</td>
      <td><span class="tag ${s.modalidad.includes('Quincenal')?'quincenal':'mensual'}">${s.modalidad}</span></td>
      <td style="text-align:right"><span class="amount-rojo">${fmt(s.prestamo)}</span></td>
    </tr>`).join('');
}

// ── AHORROS TABLE ──
function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); renderTable();
}

function renderTable(){
  const q=(document.getElementById('search-input')?.value||'').toLowerCase();
  let filtered=SOCIOS.filter(s=>s.nombre.toLowerCase().includes(q));
  if(activeFilter!=='todos') filtered=filtered.filter(s=>s.modalidad.includes(activeFilter));
  const tbody=document.getElementById('socios-tbody');
  if(!filtered.length){ tbody.innerHTML='<tr><td colspan="6"><div class="empty-msg">🔍 No se encontraron resultados</div></td></tr>'; return; }
  tbody.innerHTML=filtered.map(s=>`
    <tr onclick="openViewModal('${s.cc}')">

      <td><span class="amount-verde">${fmt(s.ahorros)}</span></td>
      <td><span class="amount-miel">${fmt(s.actividades)}</span></td>
      <td><span class="tag ${s.modalidad.includes('Quincenal')?'quincenal':'mensual'}">${s.modalidad}</span></td>
      <td style="color:var(--gris);font-size:13px">📓 ${s.libreta}</td>

    </tr>`).join('');
}

function pagosFila(p){
  const cls=p.tipo==='Ahorro'?'tipo-ahorro':'tipo-actividad';
  const valCls=p.tipo==='Ahorro'?'valor-ahorro':'valor-actividad';
  return `<tr><td style="color:var(--gris)">${p.fecha||'—'}</td><td><span class="${cls}">${p.tipo}</span></td><td style="color:var(--gris)">Cuota ${p.cuota}</td><td class="valor-cell ${valCls}">${fmt(p.valor)}</td></tr>`;
}

function openViewModal(cc){
  const s=SOCIOS.find(x=>x.cc===cc);
  const filas=s.pagos.length?s.pagos.map(pagosFila).join(''):'<tr><td colspan="4" style="color:var(--gris);text-align:center;padding:16px">Sin pagos registrados</td></tr>';

    <h2>${s.nombre}</h2>
    <p class="modal-sub">CC: ${s.cc} · Tel: ${s.telefono} · Libreta #${s.libreta}</p>

      <h3>Resumen financiero</h3>
      <div class="detail-row"><span class="lbl">Modalidad</span><span class="val">${s.modalidad}</span></div>

      <div class="detail-row"><span class="lbl">Total actividades</span><span class="val miel">${fmt(s.actividades)}</span></div>
      <div class="detail-row"><span class="lbl">Total acumulado</span><span class="val">${fmt(s.ahorros+s.actividades)}</span></div>
      ${s.prestamo>0?`<div class="detail-row"><span class="lbl">Préstamo</span><span class="val rojo">${fmt(s.prestamo)}</span></div>`:''}
    </div>
    <div class="detail-section">
      <h3>Historial de pagos (${s.pagos.length})</h3>
      <div class="pagos-table-wrap"><table class="pagos-table">
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Cuota</th><th style="text-align:right">Valor</th></tr></thead>
        <tbody>${filas}</tbody>
      </table></div>
    </div>
    <div class="modal-footer">
      <button class="btn-save" onclick="openEditModal('${s.cc}');closeModal()">✏️ Editar</button>
      <button class="btn-cancel" onclick="closeModal()">Cerrar</button>
    </div>`);
}

function openEditModal(cc){
  const s=SOCIOS.find(x=>x.cc===cc);
  const idx=SOCIOS.indexOf(s);
  showModal(`
    <h2>Editar socio/a</h2><p class="modal-sub">${s.nombre}</p>
    <div class="modal-grid">
      <div class="form-group" style="grid-column:1/-1"><label>Nombre completo</label><input id="e-nombre" value="${s.nombre}"></div>
      <div class="form-group"><label>Total ahorros</label><input type="number" id="e-ahorros" value="${s.ahorros}"></div>
      <div class="form-group"><label>Total actividades</label><input type="number" id="e-actividades" value="${s.actividades}"></div>
      <div class="form-group"><label>Préstamo</label><input type="number" id="e-prestamo" value="${s.prestamo}"></div>
      <div class="form-group"><label>Modalidad</label><select id="e-modalidad"><option ${s.modalidad.includes('Quincenal')?'selected':''}>Quincenal</option><option ${s.modalidad.includes('Mensual')?'selected':''}>Mensual</option></select></div>
      <div class="form-group"><label># Libreta</label><input id="e-libreta" value="${s.libreta}"></div>
      <div class="form-group"><label>Teléfono</label><input id="e-telefono" value="${s.telefono}"></div>
    </div>
    <div style="margin-top:18px">
      <h3 style="font-size:11px;color:rgba(212,150,58,0.6);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;border-bottom:1px solid rgba(212,150,58,0.1);padding-bottom:6px">➕ Agregar pago</h3>
      <div class="modal-grid">
        <div class="form-group"><label>Tipo</label><select id="np-tipo"><option>Ahorro</option><option>Actividad</option></select></div>
        <div class="form-group"><label>Cuota #</label><select id="np-cuota"><option>1</option><option>2</option><option>3</option></select></div>
        <div class="form-group"><label>Valor</label><input type="number" id="np-valor" placeholder="Ej: 50000"></div>
        <div class="form-group"><label>Fecha (dd/mm/aaaa)</label><input id="np-fecha" placeholder="Ej: 15/05/2026"></div>
        <div class="form-group"><label>Mes</label><select id="np-mes">${['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE'].map(m=>`<option>${m}</option>`).join('')}</select></div>
      </div>
      <button class="btn-save" style="width:auto;padding:9px 18px;font-size:13px" onclick="addPago(${idx})">+ Agregar pago</button>
    </div>
    <div class="modal-footer">
      <button class="btn-save" onclick="saveEdit(${idx})">💾 Guardar</button>
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
    </div>`);
}

function addPago(idx){
  const s=SOCIOS[idx];
  const val=parseFloat(document.getElementById('np-valor').value);
  if(!val||val<=0){ alert('Ingresa un valor válido'); return; }
  const pago={tipo:document.getElementById('np-tipo').value,cuota:parseInt(document.getElementById('np-cuota').value),valor:val,fecha:document.getElementById('np-fecha').value,mes:document.getElementById('np-mes').value};
  s.pagos.push(pago);
  if(pago.tipo==='Ahorro') s.ahorros+=val; else s.actividades+=val;
  document.getElementById('np-valor').value=''; document.getElementById('np-fecha').value='';
  alert('✅ Pago agregado'); renderStats(); renderTable(); renderPrestamos();
}

function saveEdit(idx){
  const s=SOCIOS[idx];
  s.nombre=document.getElementById('e-nombre').value||s.nombre;
  s.ahorros=parseFloat(document.getElementById('e-ahorros').value)||0;
  s.actividades=parseFloat(document.getElementById('e-actividades').value)||0;
  s.prestamo=parseFloat(document.getElementById('e-prestamo').value)||0;
  s.modalidad=document.getElementById('e-modalidad').value;
  s.libreta=document.getElementById('e-libreta').value;
  s.telefono=document.getElementById('e-telefono').value;
  closeModal(); renderStats(); renderTable(); renderPrestamos();
}
